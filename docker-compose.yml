services:
  api:
    build: .
    ports:
      - "7500:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      TEI_EMBEDDING_URL: http://tei-embed:80
      TEI_RERANKER_URL: http://tei-rerank:80
    depends_on:
      postgres:
        condition: service_healthy
      tei-embed:
        condition: service_healthy
      tei-rerank:
        condition: service_healthy
    command: uvicorn rag.api.main:app --host 0.0.0.0 --port 8000 --reload

  tei-embed:
    # RTX 4090 (sm_89). Other GPUs: 86-*, 80-*, or cuda-* tags.
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.8
    ports:
      - "7501:80"
    volumes:
      - tei_data:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --dtype
      - float16
      - --max-batch-tokens
      - "16384"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.8
    ports:
      - "7502:80"
    volumes:
      - tei_data:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model-id
      - ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - --dtype
      - float16
      - --max-batch-tokens
      - "16384"
      - --max-client-batch-size
      - "64"
      - --payload-limit
      - "8000000"
      - --auto-truncate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  tei_data:
