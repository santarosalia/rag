# RAGAS evaluation dataset template
#
# Usage:
#   uv run --no-project --with ragas --with openai --with httpx --with pyyaml \
#     python scripts/eval_ragas.py tests/eval/ragas_template.yaml --dry-run
#   python scripts/eval_ragas.py tests/eval/ragas_template.yaml --runner direct
#
# Prerequisites:
#   - RAG stack up (Postgres + indexed corpus for your group_id)
#   - LLM_API_KEY / LLM_BASE_URL (.env). judge.model must exist on that endpoint
#   - uv run --with ragas --with openai … (see README). api runner does not need in-process rag
#
# Runner:
#   api    — HTTP POST /v1/query (default; citation snippets as context)
#   direct — in-process QueryService (full chunk text; needs pip install -e .)
#
# Metrics (defaults.metrics):
#   faithfulness        — answer grounded in retrieved contexts (no ground_truth)
#   answer_relevancy    — answer addresses the question (needs embeddings API)
#   context_recall      — ground_truth covered by contexts (needs ground_truth)
#   context_precision   — retrieved contexts useful vs ground_truth (needs ground_truth)

name: ragas-eval-template
description: Copy this file and replace items with your domain Q&A pairs.

defaults:
  runner: api
  api_url: http://localhost:7500
  group_id: null
  top_k: 5
  include_citations: true

  metrics:
    - faithfulness
    - context_recall
    - context_precision

  thresholds:
    faithfulness: 0.70
    context_recall: 0.70
    context_precision: 0.70
    answer_relevancy: 0.70

  judge:
    model: Qwen/Qwen3.5-35B-A3B-FP8
    base_url: null
    api_key_env: LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096

  embeddings:
    model: text-embedding-3-small
    base_url: null
    api_key_env: LLM_API_KEY

items:
  - id: example-1
    question: 하이브리드 검색이란 무엇인가요?
    ground_truth: |
      Dense(의미) 벡터 검색과 Sparse(키워드) 검색을 RRF로 결합해
      recall을 높이는 검색 방식입니다.
    group_id: null

  - id: example-2
    question: 1기분 자동차세는 몇 월에 부과하나요?
    ground_truth: |
      1기분 자동차세는 6월에 부과·징수하며, 납기는 6월 16일부터 30일까지입니다.
    group_id: dc
