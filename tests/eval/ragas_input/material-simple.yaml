# material Docling JSON 기반 — 문서당 심플 질의 5문항 (총 50)
#
# 코퍼스: tests/material/{1..10}.json 을 parse_kind=docling_json 으로 적재
#   uv run python scripts/ingest_docling_json.py tests/material --group-id material
#
# Usage:
#   uv run python scripts/eval_ragas.py tests/eval/ragas_input/material-simple.yaml --dry-run
#   uv run python scripts/eval_ragas.py tests/eval/ragas_input/material-simple.yaml

name: material-simple
description: tests/material 문서 10개 × 심플 질의 5문항 (단답·단일 사실)
use: true

defaults:
  runner: api
  api_url: http://localhost:7500
  group_id: lit
  top_k: 5
  include_citations: true
  snippet: false
  content: true

  metrics:
    - faithfulness
    - context_recall
    - context_precision

  thresholds:
    faithfulness: 0.70
    context_recall: 0.70
    context_precision: 0.70
    answer_relevancy: 0.70

  judge:
    model: Qwen/Qwen3.5-35B-A3B-FP8
    base_url: null
    api_key_env: LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096

  embeddings:
    model: text-embedding-3-small
    base_url: null
    api_key_env: LLM_API_KEY

items:
  # --- doc 1: 2026년 정보시스템 통합유지운영 기본계획 ---
  - id: d01-s01
    question: 2026년 정보시스템 통합유지운영 사업의 사업기간은 언제인가요?
    ground_truth: |
      2026년 1월 1일부터 2026년 12월 31일까지입니다.

  - id: d01-s02
    question: 2026년 정보시스템 통합유지운영 사업의 수행업체는 어디인가요?
    ground_truth: |
      (주)군앤트입니다.

  - id: d01-s03
    question: 2026년 정보시스템 통합유지운영의 총 소요예산은 얼마인가요?
    ground_truth: |
      총 소요예산은 2,053,984천원입니다.

  - id: d01-s04
    question: KOBAnet, KODEX, 심의관리시스템 운영 및 개선은 어느 팀이 담당하나요?
    ground_truth: |
      AI혁신팀이 담당합니다.

  - id: d01-s05
    question: 2026년 정보시스템 통합유지운영 기본계획의 담당자 이메일은 무엇인가요?
    ground_truth: |
      nyuks4843@kobaco.co.kr입니다.

  # --- doc 2: AiSAC 시스템 통합 유지관리 계약 결과 보고 ---
  - id: d02-s01
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약업체는 어디인가요?
    ground_truth: |
      주식회사 나라원 시스템입니다.

  - id: d02-s02
