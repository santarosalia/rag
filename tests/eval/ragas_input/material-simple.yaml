    ground_truth: |
      170,000,000원이며 부가가치세는 별도입니다.

  - id: d02-s03
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약기간은 언제부터 언제까지인가요?
    ground_truth: |
      2026년 2월 9일부터 2026년 12월 31일까지이며 약 11개월입니다.

  - id: d02-s04
    question: AiSAC 유지관리 계약 결과 보고의 시행 문서번호는 무엇인가요?
    ground_truth: |
