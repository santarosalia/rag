# KOBACO — 2026년 AiSAC 시스템 통합 유지관리 용역 (RAGAS input)
#
# Usage:
#   uv run --no-project --with ragas --with openai --with httpx --with pyyaml \
#     python scripts/eval_ragas.py tests/eval/ragas_input/kobaco.yaml --dry-run
#
# group_id=ko 코퍼스 선행 적재.

name: kobaco
description: 한국방송광고진흥공사 AiSAC 계약 16문항 + 정보시스템 통합유지운영 15문항 + AI 솔루션·협업툴 10문항
use: true

defaults:
  runner: api
  api_url: http://localhost:7500
  group_id: ko
  top_k: 5
  include_citations: true
  snippet: false
  content: true

  metrics:
    - faithfulness
    - context_recall
    - context_precision

  thresholds:
    faithfulness: 0.70
    context_recall: 0.70
    context_precision: 0.70
    answer_relevancy: 0.70

  judge:
    model: Qwen/Qwen3.5-35B-A3B-FP8
    base_url: null
    api_key_env: LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096

  embeddings:
    model: text-embedding-3-small
    base_url: null
    api_key_env: LLM_API_KEY

items:
  - id: q1
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약업체는 어디인가요?
    ground_truth: |
      주식회사 나라원 시스템입니다.

  - id: q2
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약금액은 얼마인가요?
    ground_truth: |
      계약금액은 170,000,000원이며, 부가가치세는 별도입니다.

  - id: q3
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약기간은 언제부터 언제까지인가요?
    ground_truth: |
      2026년 2월 9일부터 2026년 12월 31일까지이며, 약 11개월입니다.

  - id: q4
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 정확한 용역명은 무엇인가요?
    ground_truth: |
      2026년 AiSAC(아이작) 시스템 통합 유지관리 용역입니다.

  - id: q5
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약업체, 계약금액, 계약기간을 알려주세요.
    ground_truth: |
      계약업체는 주식회사 나라원 시스템이며, 계약금액은 170,000,000원(부가가치세 별도)이고,
      계약기간은 2026년 2월 9일부터 2026년 12월 31일까지 약 11개월입니다.

  - id: q6
    question: 2026년 AiSAC 시스템 통합 유지관리 용역은 어떤 사업자 선정 계획과 관련되어 있나요?
    ground_truth: |
      「2026년 AiSAC(아이작) 시스템 유지관리 사업자 선정 계획(디지털혁신센터-647, 2025.12.12)」과
      관련하여 계약이 체결되었습니다.

  - id: q7
    question: 2026년 AiSAC 시스템 통합 유지관리 용역 계약 체결 결과 보고의 시행 문서번호는 무엇인가요?
    ground_truth: |
      디지털혁신센터-104입니다.

  - id: q8
    question: 2026년 AiSAC 시스템 통합 유지관리 용역 계약 체결 결과 보고의 시행일은 언제인가요?
    ground_truth: |
      2026년 2월 9일입니다.

  - id: q9
    question: 계약 체결 결과 보고서에 첨부된 관련 문서는 몇 건인가요?
    ground_truth: |
      총 6건입니다.

  - id: q10
    question: 2026년 AiSAC 시스템 통합 유지관리 용역 계약 체결 결과 보고서에 첨부된 문서는 무엇인가요?
    ground_truth: |
      ① 2026년 AiSAC 시스템 통합 유지관리 사업 계약 추진,
      ② AiSAC 시스템 통합 유지관리 용역 사업 평가위원회 결과 보고,
      ③ AiSAC 시스템 통합 유지관리 용역 사업 기술협상 결과 보고,
      ④ AiSAC 시스템 통합 유지관리 용역 사업 계약 의뢰,
      ⑤ 2026년 AiSAC 시스템 통합 유지관리 사업 계약 체결,
      ⑥ 용역표준계약서입니다.

  - id: q11
    question: AiSAC 시스템 통합 유지관리 용역의 사업자 선정과 관련하여 어떤 결과 보고서가 첨부되었나요?
    ground_truth: |
      AiSAC 시스템 통합 유지관리 용역 사업 평가위원회 결과 보고와 기술협상 결과 보고가 첨부되었습니다.

  - id: q12
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 계약금액에 부가가치세가 포함되어 있나요?
    ground_truth: |
      아니요. 계약금액 170,000,000원은 부가가치세 별도 금액입니다.

  - id: q13
    question: 2026년 AiSAC 시스템 통합 유지관리 용역은 몇 개월 동안 진행되나요?
    ground_truth: |
      2026년 2월 9일부터 12월 31일까지 약 11개월 동안 진행됩니다.

  - id: q14
    question: 해당 계약의 발주기관은 어디인가요?
    ground_truth: |
      한국방송광고진흥공사(KOBACO)입니다.

  - id: q15
    question: 2026년 AiSAC 시스템 통합 유지관리 용역의 담당자는 누구인가요?
    ground_truth: |
      디지털혁신센터 장현진입니다.

  - id: q16
    question: 2026년 AiSAC 시스템 통합 유지관리 용역 관련 문서의 비공개 등급은 어떻게 되어 있나요?
    ground_truth: |
      비공개(5)로 표시되어 있습니다.

  - id: itops-q1
    question: 2026년 정보시스템 통합유지운영 사업의 사업기간은 언제인가요?
    ground_truth: |
      2026년 1월 1일부터 2026년 12월 31일까지이며, 3/3년차 계약이다.
    expected_citation: 사업기간

  - id: itops-q2
    question: 2026년 정보시스템 통합유지운영 사업의 수행업체는 어디인가요?
    ground_truth: |
      ㈜굳앤트이다.
    expected_citation: 수행업체

  - id: itops-q3
    question: 2026년 정보시스템 통합유지운영 사업의 총 소요예산은 얼마인가요?
    ground_truth: |
      2,053,984천원(부가세 별도)이다.
    expected_citation: 소요예산

  - id: itops-q4
    question: 통합유지운영 사업비와 유지운영 실무협의비는 각각 얼마인가요?
    ground_truth: |
      통합유지운영 사업비는 2,050,000천원, 유지운영 실무협의비는 3,984천원이다.
    expected_citation: 예산표

  - id: itops-q5
    question: 정보시스템 통합유지운영 사업의 추진 목적은 무엇인가요?
    ground_truth: |
      대내외 환경변화에 유연하게 대응하기 위한 시스템 고도화, 안정적 IT서비스 제공을 통한 고객 만족도 제고,
      업무자료 보호를 위한 정보보호 및 정보시스템 발전 방향 모색이다.
    expected_citation: 추진 목적

  - id: itops-q6
    question: KOBAnet, KODEX, 심의관리시스템은 어느 팀에서 담당하나요?
    ground_truth: |
      AI혁신팀에서 담당한다.
    expected_citation: 사업범위

  - id: itops-q7
    question: 포털과 통합관리시스템 등 경영지원시스템은 어느 팀에서 담당하나요?
    ground_truth: |
      IT전략팀에서 담당한다.
    expected_citation: 사업범위

  - id: itops-q8
    question: 홈페이지 유지운영 사업의 주요 내용은 무엇인가요?
    ground_truth: |
      공사동향 및 주요사업 홍보기능 강화, 콘텐츠 관리, 홈페이지 디자인 개선 및 패밀리 사이트 활용 편의성 제고이다.
    expected_citation: 사업범위

  - id: itops-q9
    question: IT인프라 관리의 범위에는 무엇이 포함되나요?
    ground_truth: |
      서버, 네트워크, 보안장비, OA(PC 포함) 등의 장애처리 및 예방점검이 포함된다.
    expected_citation: IT인프라관리

  - id: itops-q10
    question: 정보보호 전문가 지원 업무에는 어떤 내용이 포함되나요?
    ground_truth: |
      보안취약점 점검과 모의해킹 등 정보보호 전문가 지원이 포함된다.
    expected_citation: 전문인력지원

  - id: itops-q11
    question: 정보시스템 통합유지운영의 세부 추진내용은 무엇인가요?
    ground_truth: |
      업무 이해관계자 의견수렴을 통한 시스템 개선, IT인프라 유지운영 상주 지원, 정보보안 및 개인정보보호 시스템 운영,
      성능 개선, 고품질 IT 서비스 관리체계 운용 등이 있다.
    expected_citation: 세부추진내용

  - id: itops-q12
    question: 2026년 정보시스템 및 IT인프라 성능 개선을 위해 어떤 업무를 추진하나요?
    ground_truth: |
      포털·통합관리·KOBAnet·KODEX 등 업무시스템 업그레이드, 소스코드 및 웹 취약점 점검 결과에 따른 조치,
      홈페이지 웹 표준·접근성 인증 갱신 및 개선, DB 등 분야별 전문가 협업을 통한 성능 향상 및 장애 사전 예방을 추진한다.
    expected_citation: 성능 개선

  - id: itops-q13
    question: 2026년 유지운영 SLA와 관련하여 어떤 관리 활동을 강화하나요?
    ground_truth: |
      2026년 유지운영 SLA 지표를 설정하여 성과관리 활동을 강화한다.
    expected_citation: SLA

  - id: itops-q14
    question: ITSM 시스템은 어떤 목적으로 운영하나요?
    ground_truth: |
      공사 업무환경을 고려하여 ITSM 시스템을 운영하고 체계적으로 요구사항을 관리하기 위해 운영한다.
    expected_citation: IT 서비스 관리

  - id: itops-q15
    question: 정보시스템의 체계적인 운영·관리를 위해 어떤 기준을 마련하나요?
    ground_truth: |
      정보시스템 운영절차 및 예방점검 기준을 마련한다.
    expected_citation: 고품질 IT 서비스 관리체계

  - id: S01
    question: 2026년 AI혁신팀이 이용하고자 하는 AI 솔루션 및 협업툴은 무엇인가요?
    ground_truth: |
      ChatGPT(OpenAI), Notion(Notion Labs) 등의 AI 솔루션 및 협업툴을 이용하고자 한다.

  - id: S02
    question: AI 솔루션 및 협업툴 이용의 주요 목적은 무엇인가요?
    ground_truth: |
      지능정보 서비스의 품질 향상 및 벤치마킹 등 효율적인 서비스 운영을 위해 이용한다.

  - id: S03
    question: AI 솔루션 및 협업툴 이용계획에서 언급된 서비스는 무엇인가요?
    ground_truth: |
      ChatGPT(OpenAI)와 Notion(Notion Labs)이 언급되어 있다.

  - id: S04
    question: AI 솔루션 및 협업툴은 어떤 계정으로 구독할 예정인가요?
    ground_truth: |
      AI혁신팀 대표 계정으로 구독할 예정이다.

  - id: S05
    question: AI 솔루션 및 협업툴의 이용기간은 언제까지인가요?
    ground_truth: |
      2026년 1월 15일부터 2026년 12월 31일까지이다.

  - id: S06
    question: 연간 구독 상품의 이용기간은 어떻게 적용되나요?
    ground_truth: |
      결제일로부터 1년간 이용할 예정이다.

  - id: S07
    question: AI 솔루션 및 협업툴 이용에 필요한 소요예산은 얼마인가요?
    ground_truth: |
      2,000,000원이며 부가세는 별도이다.

  - id: S08
    question: 해당 예산의 예산항목은 무엇인가요?
    ground_truth: |
      53212D3(AI광고창작시스템 구축및운영)이다.

  - id: S09
    question: 해외 솔루션 구매 시 어떤 결제수단을 사용할 예정인가요?
    ground_truth: |
      달러 결제가 가능한 회계팀 법인카드를 사용할 예정이다.

  - id: S10
    question: AI 솔루션 및 협업툴 도입을 통해 기대하는 효과 중 하나는 무엇인가요?
    ground_truth: |
      AiSAC 서비스 품질 제고 방안 강구 및 지능정보 서비스 활용 역량 증대이다.

