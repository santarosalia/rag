# material Docling JSON 기반 — 문서당 복합 질의 5문항 (총 50)
#
# 코퍼스: Markdown으로 변환 후 POST /v1/documents 로 적재
#   uv run python scripts/ingest_cli.py tests/material --group-id material
#
# Usage:
#   uv run python scripts/eval_ragas.py tests/eval/ragas_input/material-complex.yaml --dry-run
#   uv run python scripts/eval_ragas.py tests/eval/ragas_input/material-complex.yaml

name: material-complex
description: tests/material 문서 10개 × 복합 질의 5문항 (다사실·조건·비교 결합)
use: true

defaults:
  runner: api
  api_url: http://localhost:7500
  group_id: lit
  top_k: 5
  include_citations: true
  snippet: false
  content: true

  metrics:
    - faithfulness
    - context_recall
    - context_precision

  thresholds:
    faithfulness: 0.70
    context_recall: 0.70
    context_precision: 0.70
    answer_relevancy: 0.70

  judge:
    model: Qwen/Qwen3.5-35B-A3B-FP8
    base_url: null
    api_key_env: LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096

  embeddings:
    model: text-embedding-3-small
    base_url: null
    api_key_env: LLM_API_KEY

items:
  # --- doc 1: 정보시스템 통합유지운영 기본계획 ---
  - id: d01-c01
    question: 2026년 정보시스템 통합유지운영 사업의 수행업체와 사업기간, 계약 연차를 함께 알려주세요.
    ground_truth: |
      수행업체는 (주)군앤트이며, 사업기간은 2026년 1월 1일부터 12월 31일까지이고
      3/3년차 계약입니다.

  - id: d01-c02
    question: 통합유지운영 소요예산을 사업비와 실무협의비로 구분해 합계까지 알려주세요.
    ground_truth: |
      통합유지운영 사업비 2,050,000천원과 유지운영 실무협의비 3,984천원을 합해
      총 2,053,984천원입니다.

  - id: d01-c03
    question: 업무시스템 중 KOBAnet·KODEX와 경영지원시스템(포털 등)의 담당팀은 각각 어디인가요?
    ground_truth: |
      KOBAnet, KODEX, 심의관리시스템은 AI혁신팀이, 포털·통합관리시스템 등 경영지원시스템은
      IT전략팀이 담당합니다.

  - id: d01-c04
    question: 홈페이지 유지운영과 IT인프라 관리의 담당팀은 각각 어디이며, 전문인력 지원에는 어떤 업무가 포함되나요?
    ground_truth: |
      홈페이지는 대외협력팀, IT인프라 관리는 IT전략팀이 담당합니다.
      전문인력 지원에는 보안 등 관련 지원이 포함됩니다.

  - id: d01-c05
    question: 세부추진내용에서 성과관리와 요구사항 관리를 위해 각각 무엇을 운용하나요?
    ground_truth: |
      ’26년 유지운영 SLA 지표 설정으로 성과관리를 강화하고,
      ITSM 시스템을 운영해 체계적으로 요구사항을 관리합니다.

  # --- doc 2: AiSAC 계약 결과 보고 ---
  - id: d02-c01
    question: AiSAC 통합 유지관리 용역의 용역명, 계약업체, 계약금액, 계약기간을 모두 알려주세요.
    ground_truth: |
      용역명은 2026년 AiSAC(아이작) 시스템 통합 유지관리 용역이고,
      계약업체는 주식회사 나라원 시스템, 계약금액은 170,000,000원(부가세 별도),
      계약기간은 2026.2.9부터 2026.12.31까지 약 11개월입니다.

  - id: d02-c02
    question: 이 계약은 어떤 사업자 선정 계획과 관련되어 있으며, 해당 계획의 문서번호와 일자는 무엇인가요?
    ground_truth: |
      「2026년 AiSAC(아이작) 시스템 유지관리 사업자 선정 계획(디지털혁신센터-647, 2025.12.12)」과
      관련하여 체결되었습니다.

  - id: d02-c03
    question: 계약 결과 보고에 첨부된 문서가 몇 건이며, 마지막 첨부 문서는 무엇인가요?
    ground_truth: |
      총 6건이 첨부되며, 마지막은 용역표준계약서입니다.

  - id: d02-c04
    question: 계약 결과 보고의 시행 문서번호와 시행일, 담당자를 함께 알려주세요.
    ground_truth: |
      시행 문서번호는 디지털혁신센터-104이고 시행일은 2026년 2월 9일이며,
      담당자는 장현진(navy469@kobaco.co.kr)입니다.

  - id: d02-c05
    question: AiSAC 유지관리 계약금액에 부가세가 포함되는지, 계약기간은 약 몇 개월인지 알려주세요.
    ground_truth: |
      계약금액 170,000,000원은 부가세 별도이며, 계약기간은 약 11개월입니다.

  # --- doc 3: AI 솔루션 및 협업툴 ---
  - id: d03-c01
    question: AI 솔루션·협업툴을 도입하려는 목적 세 가지를 요약해 주세요.
    ground_truth: |
      지능정보 서비스 확대에 따른 업무 복합성 증대에 대응하고,
      운영 이슈·히스토리·형상관리 내역 공유 어려움을 해소하며,
      신규 서비스·기술 인사이트 도출과 개선계획 수립에 활용하기 위함입니다.

  - id: d03-c02
    question: 어떤 도구를 어떤 계정으로 구독하며, 이용기간은 어떻게 되나요?
    ground_truth: |
      ChatGPT와 Notion 등을 AI혁신팀 대표 계정으로 구독해 업무에 공유하며,
      이용기간은 2026년 1월 15일부터 12월 31일까지입니다.
      연간 구독 상품은 결제일로부터 1년간 이용할 수 있습니다.

  - id: d03-c03
    question: 소요예산과 예산항목, 해외 솔루션 결제 방법을 함께 설명해 주세요.
    ground_truth: |
      소요예산은 2,000,000원(부가세 별도)이고 예산항목은 53212D3이며,
      해외 솔루션은 달러 결제가 가능한 회계팀 법인카드로 구매할 예정입니다.

  - id: d03-c04
    question: AI 솔루션 도입으로 기대하는 효과 중 기술 검토와 인수인계 측면을 설명해 주세요.
    ground_truth: |
      도입 대상 기술의 타당성·효과성·효율성을 사전검토하고,
      인수인계에 필요한 운영 이슈·내역 파악 시간을 최소화하는 효과를 기대합니다.

  - id: d03-c05
    question: 예산은 어느 세부내역에서 쓰이며, 추가 AI 솔루션 이용은 가능한가요?
    ground_truth: |
      ’26년 예산 세부내역 중 [AI서비스 유지관리 - AI 솔루션 및 협업 툴 이용료]에서
      사용하며, 필요 시 추가 AI 솔루션 및 협업툴 활용이 가능합니다.

  # --- doc 4: 본인인증 서비스 ---
  - id: d04-c01
    question: AiSAC 본인인증 서비스의 구매목적, 구매물품, 구매업체를 알려주세요.
    ground_truth: |
      AiSAC 서비스 계정관리 기능 이용을 위해
      휴대폰번호 인증(PASS앱 인증 포함) 연단위 선납제 상품을
      NICE평가정보(주)에서 구매합니다.

  - id: d04-c02
    question: 본인인증 구매기간과 기본 제공 건수, 초과 시 단가를 함께 알려주세요.
    ground_truth: |
      구매기간은 2026년 1월 11일부터 2027년 1월 10일까지이며,
      기본 제공 5만 건을 이용하고 초과 시 건당 50원이 추가됩니다.

  - id: d04-c03
    question: 소요예산 구성(기본료와 예비비)과 예산코드를 설명해 주세요.
    ground_truth: |
      소요예산 3,000,000원(VAT 별도)은 기본료 2,300,000원과
      초과이용 예비 700,000원으로 구성되며, 예산코드는 53212D3입니다.

  - id: d04-c04
    question: 이 구매는 어떤 선행 계획과 관련되며, 구매 방법은 무엇인가요?
    ground_truth: |
      「2026년 AiSAC 서비스 정보통신망 이용 계획」(디지털혁신센터-680, 2025.12.26)과
      관련되며, 300만원 이하 소액으로 자체 구매합니다.

  - id: d04-c05
    question: 본인인증 서비스 이용 계획의 담당자와 시행 문서번호를 알려주세요.
    ground_truth: |
      담당자는 김형노(hno2221@kobaco.co.kr)이며,
      시행 문서번호는 디지털혁신센터-13입니다.

  # --- doc 5: 텍스트 생성 AI·번역 API ---
  - id: d05-c01
    question: CLOVA Studio와 Papago Translation은 각각 어떤 용도로 이용하나요?
    ground_truth: |
      CLOVA Studio는 광고 카피(N카피) 생성 및 광고영상 스토리라인 생성에 연계하고,
      Papago Translation은 이미지 생성 시 한글을 영문으로 변환하는 데 이용합니다.

  - id: d05-c02
    question: 수정품의 사유와 이용기간, 소요예산을 함께 알려주세요.
    ground_truth: |
      Papago Translation 상품 추가가 수정품의 사유이며,
      이용기간은 2026.1.1부터 2026.12.31까지이고
      소요예산은 3,000,000원(부가세 제외)입니다.

  - id: d05-c03
    question: Papago API 요금 체계와 예산계정, 예산 세부내역 사용처를 설명해 주세요.
    ground_truth: |
      Papago Text Translation API는 100만 글자당 20,000원이며,
      예산계정은 53212D3이고 [AI서비스 유지관리 - AI 서비스 API 이용료]에서 사용합니다.

  - id: d05-c04
    question: 이 API 이용의 목적과 기대효과를 연결해 설명해 주세요.
    ground_truth: |
      광고 카피·스토리보드 등 AI 텍스트 생성과 번역 API로 서비스를 안정 운영하고,
      이를 통해 AiSAC 서비스의 안정적 유지운영과 품질 제고를 기대합니다.

  - id: d05-c05
    question: 구매 방식과 시행 문서번호를 알려주세요.
    ground_truth: |
      소액으로 자체 구매하며, 시행 문서번호는 디지털혁신센터-3입니다.

  # --- doc 6: GPU 서버 인터넷 이용료 ---
  - id: d06-c01
    question: GPU 서버 인터넷 이용료의 집행 목적과 관련 선행 문서를 알려주세요.
    ground_truth: |
      AiSAC GPU 서버와 클라우드 서버 통신을 위한 연간 인터넷 사용료 집행이며,
      「2026년 AiSAC 서비스 정보통신망 이용 계획」(디지털혁신센터-680, 2025.12.26)과
      관련됩니다.

  - id: d06-c02
    question: 계약업체, 이용기간, 월 단가와 연간 총액을 알려주세요.
    ground_truth: |
      계약업체는 (주)엘지유플러스이고 이용기간은 2026.1.1~2026.12.31이며,
      월 145,200원 × 12개월 = 연 1,742,400원(부가세 포함)입니다.

  - id: d06-c03
    question: 예산계정과 집행 주기를 알려주세요.
    ground_truth: |
      예산계정은 53212D3이며 월 단위로 집행할 예정입니다.

  - id: d06-c04
    question: 집행건명과 담당자, 시행 문서번호를 함께 알려주세요.
    ground_truth: |
      집행건명은 AISAC GPU 서버 인터넷 이용료이고,
      담당자는 김형노이며 시행 문서번호는 디지털혁신센터-683입니다.

  - id: d06-c05
    question: 연간 인터넷 이용료에 부가세가 포함되는지, 월 단위 집행인지 확인해 주세요.
    ground_truth: |
      연간 1,742,400원은 부가세 포함이며, 월 단위로 집행합니다.

  # --- doc 7: 정보통신망 이용계획 ---
  - id: d07-c01
    question: 정보통신망 이용계획의 목적 두 가지를 설명해 주세요.
    ground_truth: |
      GPU 서버와 AiSAC 클라우드 서버 간 보안 검증된 통신이 필요하고,
      AiSAC 회원가입 시 본인 확인 서비스를 제공하기 위함입니다.

  - id: d07-c02
    question: 인터넷 서비스의 계약업체, 상품, 기간, 예산을 모두 알려주세요.
    ground_truth: |
      계약업체는 (주)엘지유플러스, 상품은 LG 오피스넷(500Mbps, 고정 IP 포함),
      이용기간은 2026.01.01~2026.12.31, 소요예산은 1,600,000원(부가세 별도)입니다.

  - id: d07-c03
    question: 본인인증 서비스의 계약업체, 상품, 기간, 예산을 모두 알려주세요.
    ground_truth: |
      계약업체는 나이스평가정보(주), 상품은 휴대폰번호 인증(PASS앱 포함) 연단위 선납제,
      이용기간은 2026.01.11~2027.01.10(1년), 소요예산은 3,100,000원(부가세 별도)입니다.

  - id: d07-c04
    question: 본인인증 예산 3,100,000원의 구성과 초과 요금 조건을 설명해 주세요.
    ground_truth: |
      기본료 2,300,000원과 초과이용 예비비 800,000원으로 구성되며,
      기본 제공 5만 건 초과 시 건당 50원(부가세 제외)이 추가됩니다.

  - id: d07-c05
    question: 인터넷과 본인인증을 합한 총 소요예산과 예산계정은 무엇인가요?
    ground_truth: |
      총 소요예산은 4,700,000원(부가세 제외)이며,
      예산계정은 53212D3(AI광고창작시스템 구축및운영)입니다.

  # --- doc 8: 클라우드 서비스 ---
  - id: d08-c01
    question: 클라우드 이용계획에서 CSP와 MSP는 각각 무엇이며 왜 필요한가요?
    ground_truth: |
      CSP는 공공기관용 클라우드 서비스 제공 업체로 인프라 연간 계약이 필요하고,
      MSP는 모니터링·장애 지원·보안 정책 등 관리·운영을 담당합니다.
      AiSAC 클라우드 인프라 계약 만료에 따라 계약을 갱신합니다.

  - id: d08-c02
    question: 계약업체와 CSP 업체, 주요 과업 내용을 요약해 주세요.
    ground_truth: |
      계약업체는 주식회사 아이지니이며 CSP는 네이버 클라우드입니다.
      과업은 네이버 클라우드 계약 체결, 인프라 관리·기술지원, 자원 최적화 컨설팅,
      시스템 보안 취약점 점검(연 1회)입니다.

  - id: d08-c03
    question: 이용기간, 계약방법, 수의계약의 법적 근거를 알려주세요.
    ground_truth: |
      이용기간은 2026.1.1~2026.12.31이며
      디지털서비스이용지원시스템(digitalmarket.kr)을 통한 수의계약입니다.
      근거로 국가계약법 시행령 제26조 제1항 제5호 아목 등이 제시됩니다.

  - id: d08-c04
    question: 월 집행 예상액, 연간 예상액, 연간 한도를 비교해 설명해 주세요.
    ground_truth: |
      월 집행 예상은 3,191,790원(부가세 별도), 연간 예상은 37,581,480원이며,
      연간 한도는 49,500,000원(부가세 별도)입니다.
      후청구 방식으로 사용량에 따라 청구액이 달라질 수 있습니다.

  - id: d08-c05
    question: 이 계획이 지원하는 서비스 범위(AiSAC·빅데이터)를 설명해 주세요.
    ground_truth: |
      AiSAC(광고영상 아카이브, 트렌드 시각화, AI 카피라이팅, 스토리보드)와
      빅데이터 시각화 서비스(공익광고 데이터광장)의 IT인프라 및 관리 서비스를 제공합니다.

  # --- doc 9: 2차 평가위원회 ---
  - id: d09-c01
    question: 2차 평가위원회를 다시 개최하는 사유와 관련 금액을 설명해 주세요.
    ground_truth: |
      1차 평가(’26.1.16)에서 적격인 (주)나라원 시스템의 입찰가격 186,340,000원이
      조달청 예비가격정보 186,264,650원을 초과해 유찰되었기 때문입니다.

  - id: d09-c02
    question: 사업 개요(사업명, 사업기간, 사업비)와 평가 배점을 알려주세요.
    ground_truth: |
      사업명은 2026년 AiSAC(아이작) 시스템 통합 유지관리 용역 사업이고,
      사업기간은 ’26.2.1~’26.12.31, 사업비는 170,000,000원(부가세 별도)입니다.
      평가는 기술 90점·가격 10점(총 100점)입니다.

  - id: d09-c03
    question: 기술평가 적격 기준과 우선협상대상자 선정 방식을 설명해 주세요.
    ground_truth: |
      기술평가 100점 기준 85점(90점 기준 76.5점) 이상만 적격이며,
      적격 업체에만 가격평가를 실시합니다.
      기술·가격 합산 최고점 업체를 우선협상대상자로 선정하고,
      동점 시 기술평가 고득점자를 우선합니다.

  - id: d09-c04
    question: 심사일시·장소와 내부·외부 심사위원 구성을 알려주세요.
    ground_truth: |
      2026년 1월 27일(화) 15:00 본사 17층 대회의실에서 개최하며,
      심사위원은 외부 4명·내부 3명으로 총 7명입니다.
      내부에는 박정수·오명진·박세진 팀장 등이 포함됩니다.

  - id: d09-c05
    question: 소요예산 세부내역과 계정과목을 알려주세요.
    ground_truth: |
      총 1,300,000원으로 심사비(원가산정 용역비) 1,200,000원과
      진행비(운영업체 선정 심사비) 100,000원이며,
      계정과목은 53212D3입니다.

  # --- doc 10: 연간 정보화 기본 계획 ---
  - id: d10-c01
    question: 추진 목표와 정보화 추진 과제·대상 서비스를 연결해 설명해 주세요.
    ground_truth: |
      추진 목표는 정보화 전략 수립, AX 추진 전략, 대외 시스템 안정 운영·고객 만족입니다.
      과제는 AI 인프라 구축·서비스 고도화·안정적 서비스 운영이며,
      대상은 AiSAC, KOBAnet, KODEX, CmREVIEW입니다.

  - id: d10-c02
    question: AiSAC 고도화에서 스토리보드 모델과 이미지 생성 모델 개선 내용을 알려주세요.
    ground_truth: |
      스토리보드 생성형 모델을 HCX-003에서 HCX-007로 업그레이드하고,
      FLUX 모델의 생성 속도·품질을 개선하는 등 이미지 생성 AI 모델 선택·성능 최적화를 추진합니다.

  - id: d10-c03
    question: AiSAC 통합유지운영 SLA 지표 구성(비중 포함)을 설명해 주세요.
    ground_truth: |
      SR 적기 처리율 40%, AP 장애 시간 30%, 자체 개선 활동 30%이며,
      각 지표는 월 단위로 산정하고 합으로 종합 점수를 평가합니다.

  - id: d10-c04
    question: 연간 정보화 기본 계획 총 소요예산과 AI광고창작시스템 유지운영 용역·클라우드 서버 운영비 금액을 알려주세요.
    ground_truth: |
      총 소요예산은 360,500천원이며,
      광고창작지원 시스템 유지운영 용역 170,000천원,
      클라우드 서버 운영비 49,500천원입니다.

  - id: d10-c05
    question: KOBAnet과 KODEX의 고도화 추진 사례를 각각 한 가지 이상 들어 주세요.
    ground_truth: |
      KOBAnet은 FAQ AI 챗봇 개발, 가상광고 청약 개선, 영업업무 효율화 기능개선 등을 추진하고,
      KODEX는 Open API 활용 개선, AI 음성인식 멘트 자동추출, AI 기반 심의 보조 프로토타입 등을
      추진합니다.
