# KOBACO — 정보시스템 통합유지운영 패러프레이즈/멀티홉 (RAGAS input)
#
# Usage:
#   uv run --no-project --with ragas --with openai --with httpx --with pyyaml \
#     python scripts/eval_ragas.py tests/eval/ragas_input/kobaco-multi-hop.yaml --dry-run
#
# group_id=ko 코퍼스 선행 적재.

name: kobaco-multi-hop
description: 한국방송광고진흥공사 통합유지운영 패러프레이즈 10문항 + AI 솔루션·협업툴 복합 질의 10문항
use: true

defaults:
  runner: api
  api_url: http://localhost:7500
  group_id: lit
  top_k: 5
  include_citations: true
  snippet: false
  content: true

  metrics:
    - faithfulness
    - context_recall
    - context_precision

  thresholds:
    faithfulness: 0.70
    context_recall: 0.70
    context_precision: 0.70
    answer_relevancy: 0.70

  judge:
    model: Qwen/Qwen3.5-35B-A3B-FP8
    base_url: null
    api_key_env: LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096

  embeddings:
    model: text-embedding-3-small
    base_url: null
    api_key_env: LLM_API_KEY

items:
  - id: q16
    question: KOBACO의 2026년 통합유지운영 사업은 몇 년 차 계약인가요?
    ground_truth: |
      3/3년차 계약

  - id: q17
    question: 이 사업을 수행하는 업체는 어디인가요?
    ground_truth: |
      ㈜굳앤트

  - id: q18
    question: 2026년 통합유지운영에 책정된 예산 규모는 어느 정도인가요?
    ground_truth: |
      2,053,984천원(부가세 별도)

  - id: q19
    question: 서버나 네트워크 장애 예방을 담당하는 업무 범위는 무엇인가요?
    ground_truth: |
      서버, 네트워크, 보안장비, OA(PC 포함)의 장애처리 및 예방점검

  - id: q20
    question: 업무시스템 중 KOBAnet과 KODEX의 유지운영을 담당하는 조직은 어디인가요?
    ground_truth: |
      AI혁신팀

  - id: q21
    question: 홈페이지 관련 유지운영에서는 어떤 개선을 추진하나요?
    ground_truth: |
      홍보기능 강화·콘텐츠 관리, 디자인 개선, 패밀리 사이트 활용 편의성 제고

  - id: q22
    question: 보안 분야에서 통합유지운영 사업자가 지원해야 하는 전문 업무는 무엇인가요?
    ground_truth: |
      보안취약점 점검, 모의해킹 등 정보보호 전문가 지원

  - id: q23
    question: 업무시스템 성능 개선을 위해 업그레이드 대상으로 언급된 시스템은 무엇인가요?
    ground_truth: |
      포털, 통합관리, KOBAnet, KODEX 등

  - id: q24
    question: 유지운영 성과관리를 강화하기 위해 어떤 지표를 설정하나요?
    ground_truth: |
      2026년 유지운영 SLA 지표

  - id: q25
    question: 요구사항을 체계적으로 관리하기 위해 어떤 시스템을 운영하나요?
    ground_truth: |
      ITSM 시스템

  - id: C01
    question: AI혁신팀이 AI 솔루션 및 협업툴을 이용하려는 이유와 이를 통해 기대하는 효과는 무엇인가요?
    ground_truth: |
      이용 이유는 지능정보 서비스 운영의 복합성 증가, 운영 이슈·히스토리 및 업체 간 형상관리 내역 공유의 어려움,
      신규 서비스·기술 관련 인사이트 도출 및 개선계획 수립 때문이다.
      기대효과는 AiSAC 서비스 품질 제고, 지능정보 서비스 활용 역량 증대, 도입 기술의 타당성·효과성·효율성 검토,
      인수인계에 필요한 시간 최소화 등이다.

  - id: C02
    question: 2026년 AI혁신팀의 AI 솔루션 및 협업툴 이용기간과 구독 방식은 어떻게 계획되어 있나요?
    ground_truth: |
      이용기간은 2026년 1월 15일부터 12월 31일까지이며, 연간 구독 상품은 결제일로부터 1년간 이용할 예정이다.
      구독은 AI혁신팀 대표 계정으로 진행하고 업무를 공유한다.

  - id: C03
    question: AI혁신팀이 ChatGPT와 Notion을 이용하려는 목적은 각각 무엇인가요?
    ground_truth: |
      문서상 ChatGPT와 Notion 각각의 세부적인 개별 용도는 명시되어 있지 않으며,
      AI 솔루션 및 협업툴을 지능정보 서비스 품질 향상, 벤치마킹 및 효율적인 서비스 운영 등에 활용하려는 계획이다.

  - id: C04
    question: AI 솔루션 및 협업툴 이용 예산은 얼마이며, 어떤 예산항목에서 사용하나요?
    ground_truth: |
      소요예산은 2,000,000원(부가세 별도)이며, 예산항목은 53212D3(AI광고창작시스템 구축및운영)이다.

  - id: C05
    question: AI혁신팀은 운영 업무의 복합성이 증가하고 어떤 정보의 공유에 어려움이 있어 AI 솔루션 및 협업툴을 도입하려고 하나요?
    ground_truth: |
      지능정보 서비스 확대로 운영 업무의 복합성이 증가했으며,
      서비스 운영 관련 이슈 및 히스토리와 업체 간 형상관리 내역을 공유하는 데 어려움이 발생했기 때문이다.

  - id: C06
    question: 신규 AI 솔루션 및 협업툴을 추가로 도입할 수 있나요? 그렇다면 어떤 조건인가요?
    ground_truth: |
      가능하다. 이용계획에는 ChatGPT(OpenAI), Notion(Notion Labs) 등이 명시되어 있으며,
      필요시 추가 AI 솔루션 및 협업툴을 활용할 수 있다고 되어 있다.

  - id: C07
    question: AI 솔루션 및 협업툴을 대표 계정으로 구독하는 이유와 기대효과를 함께 설명해주세요.
    ground_truth: |
      AI혁신팀 대표 계정으로 구독 후 업무를 공유할 계획이며,
      이를 통해 운영 이슈 및 내역을 파악하는 인수인계 시간을 최소화하고 업무 공유를 효율화할 수 있다.

  - id: C08
    question: 해외 솔루션을 구매할 경우 비용 처리는 어떻게 하며, 관련 예산은 어디에서 사용할 예정인가요?
    ground_truth: |
      해외 솔루션은 달러 결제가 가능한 회계팀 법인카드로 구매하며,
      2026년 예산 세부내역 중 ‘AI서비스 유지관리 - AI 솔루션 및 협업 툴 이용료’에서 예산을 사용할 예정이다.

  - id: C09
    question: AI 솔루션 및 협업툴을 도입하기 전에 기술 도입의 타당성을 검토하는 데 어떻게 활용할 수 있나요?
    ground_truth: |
      신규 기술이나 도입 대상 기술을 사전에 검토하는 도구로 활용하여 기술 도입의 타당성, 효과성, 효율성 등을 검토할 수 있다.

  - id: C10
    question: 이 계획에서 AI 솔루션 및 협업툴 이용을 통해 서비스 품질 개선과 업무 인수인계 측면에서 각각 어떤 효과를 기대하고 있나요?
    ground_truth: |
      서비스 품질 측면에서는 AiSAC 서비스 품질 제고 방안을 강구하고 지능정보 서비스 활용 역량을 높이는 것을 기대한다.
      인수인계 측면에서는 운영 이슈 및 내역을 파악하는 데 필요한 시간 소요를 최소화하는 것을 기대한다.
